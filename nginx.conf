# Nginx Configuration for MD. Shinha Sarder Portfolio & Blog
# Optimized for High Performance, Maximum SEO, Security, and SPA Routing

# HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mdshinhasarder.com www.mdshinhasarder.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://mdshinhasarder.com$request_uri;
}

# Redirect www to non-www (canonical domain for SEO Rank 1)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mdshinhasarder.com;

    # SSL Certificate Paths (update with your certbot / Cloudflare Origin cert paths)
    ssl_certificate /etc/ssl/certs/mdshinhasarder.com.pem;
    ssl_certificate_key /etc/ssl/private/mdshinhasarder.com.key;

    return 301 https://mdshinhasarder.com$request_uri;
}

# Primary HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mdshinhasarder.com;

    root /var/www/mdshinhasarder/dist;
    index index.html;

    # SSL Security Configuration
    ssl_certificate /etc/ssl/certs/mdshinhasarder.com.pem;
    ssl_certificate_key /etc/ssl/private/mdshinhasarder.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Top-tier Security Headers (SEO & Lighthouse A+ compliance)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression for Fast PageSpeed & SEO
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Static Assets with long cache (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static media (images, icons)
    location ~* \.(?:webp|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        access_log off;
    }

    # Robots and sitemaps
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    location ~* \.xml$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # SPA Routing Fallback (Prevents 404 on refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Node.js / Express reverse proxy if running Node backend
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
